name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run unit tests (if present)
        shell: pwsh
        run: |
          if (Test-Path "test_linkedin_simulator.py") {
            python -m unittest test_linkedin_simulator.py
          }

      - name: Build Windows Executable (.exe)
        run: |
          pyinstaller --onefile --noconsole --name "LinkedIn_DSA_Simulator" linkedin_simulator.py

      - name: Create GitHub Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: LinkedIn DSA Simulator ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/LinkedIn_DSA_Simulator.exe
