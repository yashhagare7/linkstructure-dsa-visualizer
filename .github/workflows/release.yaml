name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*' # Triggers automatically whenever you push a tag like v1.0.1

permissions:
  contents: write # Required to allow the workflow to publish a release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compile EXE
        run: pyinstaller --onefile --windowed linkedin_app.py

      - name: Create GitHub Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: dist/linkedin_app.exe
          generate_release_notes: true
